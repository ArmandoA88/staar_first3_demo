name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build-macos-installer:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          echo "version=$(python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          print(config['version'])
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS launcher DMG
        run: python scripts/build_macos_dmg.py

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-macos-dmg-v${{ steps.app_version.outputs.version }}
          path: STAAR Problem Browser_${{ steps.app_version.outputs.version }}_macOS.dmg
          if-no-files-found: error
          retention-days: 14
