name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build-macos-installer:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          echo "version=$(python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          print(config['version'])
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Rust stable with macOS universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build macOS Tauri DMG
        run: npm run tauri:build:dmg:root

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-macos-dmg-v${{ steps.app_version.outputs.version }}
          path: STAAR Problem Browser_${{ steps.app_version.outputs.version }}_macOS.dmg
          if-no-files-found: error
          retention-days: 14
