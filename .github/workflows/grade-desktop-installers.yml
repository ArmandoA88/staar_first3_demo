name: Build Grade-Split Desktop Installers

on:
  workflow_dispatch:
    inputs:
      grades_json:
        description: JSON array of grades to build, for example [3] or [3,4,5]
        required: true
        default: "[3]"
        type: string
      build_windows:
        description: Build Windows MSI artifacts
        required: true
        default: true
        type: boolean
      build_macos:
        description: Build macOS DMG artifacts
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "desktop-grades-v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Grade ${{ matrix.grade }} Windows MSI
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        grade: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.grades_json || '[3]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          $wixBinCandidates = @(
            "${env:WIX}\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $wixBinCandidates) {
            throw "WiX Toolset bin directory was not found after installation."
          }
          $wixBinCandidates[0] | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe candle
          where.exe light

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build grade-specific Windows MSI
        run: node scripts/build_tauri_grade_bundle.js --platform windows --grade ${{ matrix.grade }}

      - name: Upload grade-specific Windows MSI from repo root
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-grade-${{ matrix.grade }}-windows-msi
          path: ./STAAR Problem Browser Grade ${{ matrix.grade }}_*_windows.msi
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build Grade ${{ matrix.grade }} macOS DMG
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        grade: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.grades_json || '[3]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Rust stable with macOS universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build grade-specific macOS DMG
        run: node scripts/build_tauri_grade_bundle.js --platform macos --grade ${{ matrix.grade }}

      - name: Upload grade-specific macOS DMG from repo root
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-grade-${{ matrix.grade }}-macos-dmg
          path: ./STAAR Problem Browser Grade ${{ matrix.grade }}_*_macOS.dmg
          if-no-files-found: error
          retention-days: 14
