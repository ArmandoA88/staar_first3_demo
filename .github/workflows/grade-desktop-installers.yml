name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      variants_json:
        description: JSON array of variants to build, for example ["4","5","all"]
        required: true
        default: '["4","5","6","7","8","9","10","11","all"]'
        type: string
      build_windows:
        description: Build Windows MSI artifacts
        required: true
        default: true
        type: boolean
      build_macos:
        description: Build macOS DMG artifacts
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "desktop-grades-v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ${{ matrix.variant == 'all' && 'All Grades' || format('Grade {0}', matrix.variant) }} Windows MSI
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.variants_json || '["4","5","6","7","8","9","10","11","all"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          $wixBinCandidates = @(
            "${env:WIX}\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $wixBinCandidates) {
            throw "WiX Toolset bin directory was not found after installation."
          }
          $wixBinCandidates[0] | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe candle
          where.exe light

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare Windows variant metadata
        id: variant
        shell: pwsh
        run: |
          $variant = '${{ matrix.variant }}'
          if ($variant -eq 'all') {
            "label=All Grades" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "artifact_slug=all-grades" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "upload_path=./STAAR Problem Browser All Grades_*_windows.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "label=Grade $variant" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "artifact_slug=grade-$variant" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "upload_path=./STAAR Problem Browser Grade $variant_*_windows.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Build Windows MSI
        run: node scripts/build_tauri_grade_bundle.js --platform windows --grade ${{ matrix.variant }}

      - name: Upload Windows MSI from repo root
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-${{ steps.variant.outputs.artifact_slug }}-windows-msi
          path: ${{ steps.variant.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build ${{ matrix.variant == 'all' && 'All Grades' || format('Grade {0}', matrix.variant) }} macOS DMG
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.variants_json || '["4","5","6","7","8","9","10","11","all"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Rust stable with macOS universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare macOS variant metadata
        id: variant
        shell: bash
        run: |
          variant='${{ matrix.variant }}'
          if [[ "$variant" == "all" ]]; then
            echo "label=All Grades" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=all-grades" >> "$GITHUB_OUTPUT"
            echo "upload_path=./STAAR Problem Browser All Grades_*_macOS.dmg" >> "$GITHUB_OUTPUT"
          else
            echo "label=Grade $variant" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=grade-$variant" >> "$GITHUB_OUTPUT"
            echo "upload_path=./STAAR Problem Browser Grade $variant_*_macOS.dmg" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS DMG
        run: node scripts/build_tauri_grade_bundle.js --platform macos --grade ${{ matrix.variant }}

      - name: Upload macOS DMG from repo root
        uses: actions/upload-artifact@v4
        with:
          name: staar-problem-browser-${{ steps.variant.outputs.artifact_slug }}-macos-dmg
          path: ${{ steps.variant.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 14
