<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STAAR Problem Catalog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="sidebar-block">
          <p class="eyebrow">STAAR Catalog</p>
          <h1>Grade 3 Math Problem Browser</h1>
          <p class="sidebar-copy">
            Filter every extracted problem by TEKS, year, difficulty, item type, or review status.
          </p>
        </div>

        <div class="sidebar-block">
          <label class="filter-label" for="search-input">Search</label>
          <input id="search-input" class="text-input" type="search" placeholder="TEKS, stem, cluster, answer" />
        </div>

        <div class="sidebar-block">
          <label class="filter-label" for="teks-filter">TEKS</label>
          <select id="teks-filter" class="select-input">
            <option value="">All TEKS</option>
          </select>
        </div>

        <div class="sidebar-grid">
          <div class="sidebar-block">
            <label class="filter-label" for="year-filter">Year</label>
            <select id="year-filter" class="select-input">
              <option value="">All years</option>
            </select>
          </div>

          <div class="sidebar-block">
            <label class="filter-label" for="difficulty-filter">Difficulty</label>
            <select id="difficulty-filter" class="select-input">
              <option value="">All levels</option>
            </select>
          </div>
        </div>

        <div class="sidebar-grid">
          <div class="sidebar-block">
            <label class="filter-label" for="item-type-filter">Item Type</label>
            <select id="item-type-filter" class="select-input">
              <option value="">All types</option>
            </select>
          </div>

          <div class="sidebar-block">
            <label class="filter-label" for="content-filter">Content</label>
            <select id="content-filter" class="select-input">
              <option value="">All content</option>
            </select>
          </div>
        </div>

        <div class="sidebar-block toggle-row">
          <label for="review-only">Needs review only</label>
          <input id="review-only" type="checkbox" />
        </div>

        <div class="sidebar-block">
          <button id="reset-filters" class="secondary-button" type="button">Reset filters</button>
        </div>

        <div id="catalog-stats" class="sidebar-block stats-panel"></div>
      </aside>

      <main class="main-content">
        <section class="hero-panel">
          <div>
            <p class="eyebrow">Problem Finder</p>
            <h2>Browse by TEKS, year, and estimated difficulty</h2>
          </div>
          <p id="results-summary" class="hero-summary">Loading catalog...</p>
        </section>

        <section class="summary-grid">
          <article class="summary-panel">
            <div class="panel-header">
              <h3>TEKS</h3>
              <span id="teks-count" class="count-pill"></span>
            </div>
            <div id="teks-groups" class="chip-grid"></div>
          </article>

          <article class="summary-panel">
            <div class="panel-header">
              <h3>Years</h3>
              <span id="year-count" class="count-pill"></span>
            </div>
            <div id="year-groups" class="chip-grid"></div>
          </article>

          <article class="summary-panel">
            <div class="panel-header">
              <h3>Difficulty</h3>
              <span id="difficulty-count" class="count-pill"></span>
            </div>
            <div id="difficulty-groups" class="chip-grid"></div>
          </article>
        </section>

        <section id="results" class="results-grid" aria-live="polite"></section>
      </main>
    </div>

    <template id="item-card-template">
      <article class="item-card">
        <div class="item-meta"></div>
        <div class="item-body">
          <div class="item-text">
            <h3 class="item-title"></h3>
            <p class="item-instruction"></p>
            <ul class="option-list"></ul>
            <div class="response-template"></div>
            <div class="visual-list"></div>
          </div>
          <img class="item-image" alt="" loading="lazy" />
        </div>
        <div class="item-footer">
          <div class="answer-block"></div>
          <div class="difficulty-block"></div>
        </div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
