<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launching STAAR Problem Browser</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #f8f2e8;
        --bg-end: #eef3f5;
        --panel: rgba(255, 252, 246, 0.96);
        --line: rgba(31, 56, 73, 0.12);
        --ink: #163042;
        --muted: #576977;
        --accent: #0f6c7d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Trebuchet MS", "Gill Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(214, 226, 233, 0.84), transparent 36%),
          radial-gradient(circle at bottom right, rgba(239, 220, 194, 0.52), transparent 30%),
          linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
      }

      .splash-card {
        width: min(560px, 100%);
        padding: 30px 30px 26px;
        border-radius: 30px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 28px 70px rgba(22, 48, 66, 0.16);
      }

      .splash-mark {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(22, 48, 66, 0.16);
      }

      .eyebrow {
        margin: 18px 0 10px;
        color: var(--accent);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Palatino Linotype", serif;
        font-size: clamp(2.5rem, 8vw, 4.2rem);
        line-height: 0.92;
        letter-spacing: -0.04em;
      }

      .status {
        margin: 18px 0 0;
        max-width: 34ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .reassurance {
        margin: 18px 0 0;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(15, 108, 125, 0.08);
        color: var(--ink);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .loading-row {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
      }

      .loading-row span {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: var(--accent);
        opacity: 0.22;
        animation: pulse 1.1s ease-in-out infinite;
      }

      .loading-row span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .loading-row span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.22;
          transform: scale(0.88);
        }

        45% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash-card" role="status" aria-live="polite">
      <img class="splash-mark" src="assets/texas-star-logo.svg" alt="" />
      <p class="eyebrow">Desktop Launch</p>
      <h1>STAAR Problem Browser</h1>
      <p id="status" class="status">Opening the desktop shell and loading the bundled catalog.</p>
      <div class="loading-row" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="reassurance">
        This can take a moment on slower machines or first launch. The app has not crashed.
      </p>
    </main>

    <script>
      const status = document.getElementById("status");
      const messages = [
        "Opening the desktop shell and loading the bundled catalog.",
        "Reading local collections, images, and print assets.",
        "Preparing the teacher workspace and startup checks.",
      ];

      let index = 0;
      window.setInterval(() => {
        index = (index + 1) % messages.length;
        status.textContent = messages[index];
      }, 1800);
    </script>
  </body>
</html>
